worker_processes 1;

events { worker_connections 1024; }

http {
    upstream fastapi {
        server localhost:8001;
    }

    upstream nextjs {
        server localhost:3000;
    }

    server {
        listen 8080;

        # Extension API (unchanged contract)
        location /api/extension/ {
            proxy_pass http://fastapi;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 30s;
        }

        # Dashboard API
        location /api/ {
            proxy_pass http://fastapi;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # 600s covers the daily assignment cron's batched BQ INSERTs
            # (~83 batches at 500 rows × ~3s each). Heaviest observed run:
            # 76k rows → ~150 batches. Cron path is /api/system/run-assignment.
            proxy_read_timeout 600s;
        }

        # Next.js
        location / {
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}

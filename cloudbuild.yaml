steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/arboreal-vision-339901/docker-images-repo/reengage-ops-dashboard-v2:$COMMIT_SHA'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/arboreal-vision-339901/docker-images-repo/reengage-ops-dashboard-v2:$COMMIT_SHA'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'reengage-ops-dashboard-v2'
      - '--image=us-central1-docker.pkg.dev/arboreal-vision-339901/docker-images-repo/reengage-ops-dashboard-v2:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--memory=4096Mi'
      - '--min-instances=0'
      - '--max-instances=3'
      - '--timeout=3600'
      - '--allow-unauthenticated'
      - '--add-cloudsql-instances=arboreal-vision-339901:us-central1:mysqladmin'
      - '--set-env-vars=GOOGLE_OAUTH_REDIRECT_URI=https://reengage-ops-dashboard-v2-ul5ne76yva-uc.a.run.app/login,DB_HOST=/cloudsql/arboreal-vision-339901:us-central1:mysqladmin,DB_PORT=5432,DB_NAME=loop_core,NEXT_PUBLIC_GOOGLE_CLIENT_ID=983150008719-7v42pvpog93epoaf8fs8jlrmmv4f7ss0.apps.googleusercontent.com,NEXT_PUBLIC_OAUTH_REDIRECT_URI=https://reengage-ops-dashboard-v2-ul5ne76yva-uc.a.run.app/login,ENV=production,DUAL_WRITE_PG=true,NEAR_BUFFER_PER_OPERATOR=700,NEAR_URGENT_MAX_HOURS=96'
      - '--set-secrets=GCP_REFRESH_TOKEN=reengage-v2-gcp-refresh-token:latest,GCP_CLIENT_ID=reengage-v2-gcp-client-id:latest,GCP_CLIENT_SECRET=reengage-v2-gcp-client-secret:latest,GOOGLE_OAUTH_CLIENT_ID=reengage-v2-google-oauth-client-id:latest,GOOGLE_OAUTH_CLIENT_SECRET=reengage-v2-google-oauth-client-secret:latest,DB_USER=reengage-v2-db-user:latest,DB_PASSWORD=reengage-v2-db-password:latest,JWT_SECRET_KEY=reengage-v2-jwt-secret:latest'

images:
  - 'us-central1-docker.pkg.dev/arboreal-vision-339901/docker-images-repo/reengage-ops-dashboard-v2:$COMMIT_SHA'
